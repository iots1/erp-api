services:
  erp-db:
    image: postgres:18
    restart: always
    command: >
      postgres
      -c max_connections=200
      -c idle_in_transaction_session_timeout=60000
      -c idle_session_timeout=300000
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
      POSTGRES_USER: ${POSTGRES_USER:-devhis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infrastructure/infra-erp/.env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./data/erp_data:/var/lib/postgresql/data

  erp-redis:
    image: redis:8.6.4-alpine
    restart: always
    ports:
      - "${REDIS_PORT:-6333}:6379"
    volumes:
      - ./data/redis_data:/data
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in infrastructure/infra-erp/.env}
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  erp-rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in infrastructure/infra-erp/.env}
    ports:
      - "${RABBITMQ_PORT:-5666}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - ./data/rabbitmq_data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.50'
          memory: 512M

  # S3-compatible object store backing the `storage` BC (apps/storage) — see
  # STORAGE_S3_* in the root .env. Also where report-bc uploads generated PDFs.
  erp-minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in infrastructure/infra-erp/.env}
    ports:
      - "${MINIO_API_PORT:-9000}:9000" # S3 API — matches STORAGE_S3_ENDPOINT
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # Web console
    volumes:
      - ./data/minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # HTML → PDF renderer (headless Chromium) used by report-bc to turn its
  # server-rendered EJS templates into PDFs before handing them to the
  # `storage` BC for persistence. See GOTENBERG_URL in the root .env.
  #
  # Print templates (and, per template, their own paginator script — see
  # BandedRenderService) run as real JS inside this Chromium, so it's treated
  # as executing untrusted admin-authored code, not just a static renderer:
  #  - port bound to 127.0.0.1 only — report-bc (and every other caller) runs
  #    on the same host and reaches it via localhost, so nothing legitimate
  #    needs this reachable from the LAN/network.
  #  - --chromium-deny-list blocks the page's own fetch()/XHR/img/script
  #    requests from reaching loopback, RFC1918 private ranges, and
  #    169.254.0.0/16 (covers cloud metadata endpoints) — closes off SSRF
  #    from injected template JS into other containers on this compose
  #    network (minio, rabbitmq mgmt UI, etc).
  erp-gotenberg:
    image: gotenberg/gotenberg:8
    restart: always
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=false"
      - "--api-timeout=30s"
      - "--chromium-deny-list=^https?://(127\\.|10\\.|172\\.(1[6-9]|2[0-9]|3[0-1])\\.|192\\.168\\.|169\\.254\\.).*"
    ports:
      - "127.0.0.1:${GOTENBERG_PORT:-3009}:3000"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
